# /etc/nginx/sites-available/nova-habitation-piscine
# HTTPS is added on top of this file by certbot (see DEPLOY.md, step 6).

# The back office is never indexed (also blocked in robots.txt). An empty value sends no header.
map $uri $robots_tag {
    ~^/admin "noindex, nofollow";
    default  "";
}

# www → bare domain, so the site has a single address.
server {
    listen 80;
    listen [::]:80;
    server_name www.nova-habitat-piscine.fr;
    return 301 https://nova-habitat-piscine.fr$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name nova-habitat-piscine.fr;

    # Angular build: static files from browser/; pages are rendered by the
    # nova-frontend service (server/server.mjs, port 4000), see "location /" below.
    root /var/www/nova-habitation-piscine/browser;

    # Photos uploaded from the admin panel; must match MAX_FILE_SIZE (10 MB) + margin.
    client_max_body_size 12m;

    # Security headers. nginx drops these in any location that sets its own
    # add_header, so they are repeated in each location below.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # NestJS API
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Site map generated by the backend, so new chantiers are listed for search engines automatically
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3000/api/sitemap.xml;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Uploaded images, served directly from disk by nginx
    location /uploads/ {
        alias /opt/nova-habitation-backend/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Built JS/CSS have a hash in their name: cache them for a long time.
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Existing files (images, robots.txt, favicon…) are served from disk; every page
    # (/, /realisations, /chantier/12, ...) is rendered by the Angular server.
    location / {
        try_files $uri @ssr;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location @ssr {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        # Angular only renders for the hosts listed in angular.json (security.allowedHosts).
        # No X-Forwarded-* headers: Angular falls back to an empty, browser-rendered page when it
        # receives proxy headers it wasn't told to trust, and it doesn't need them (the public
        # address is fixed in the code).
        proxy_set_header Host $host;
        # Rendered pages hold live content: never cache them
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag $robots_tag always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
