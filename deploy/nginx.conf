# /etc/nginx/sites-available/nova-habitation-piscine
# HTTPS is added on top of this file by certbot (see DEPLOY.md, step 6).

# www → bare domain, so the site has a single address.
server {
    listen 80;
    listen [::]:80;
    server_name www.nova-habitation-piscine.fr;
    return 301 https://nova-habitation-piscine.fr$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name nova-habitation-piscine.fr;

    # Angular build (contents of dist/nova-habitation-piscine/browser)
    root /var/www/nova-habitation-piscine;
    index index.html;

    # Photos uploaded from the admin panel; must match MAX_FILE_SIZE (10 MB) + margin.
    client_max_body_size 12m;

    # Security headers. nginx drops these in any location that sets its own
    # add_header, so they are repeated in each location below.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # NestJS API
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Uploaded images, served directly from disk by nginx
    location /uploads/ {
        alias /opt/nova-habitation-backend/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Built JS/CSS have a hash in their name: cache them for a long time.
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Angular routes (/realisations, /chantier/12, ...) all load index.html,
    # which must never be cached so visitors get new versions immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
